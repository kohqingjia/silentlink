name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend-and-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-dev.txt -r ml/requirements.txt
      - run: pytest -q
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
  ios-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compile for simulator (does not test sensors)
        run: xcodebuild -project ios/SilentLink.xcodeproj -scheme SilentLink -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
