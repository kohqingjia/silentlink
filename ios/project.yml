name: SilentLink
options:
  bundleIdPrefix: research.silentlink
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic
targets:
  SilentLink:
    type: application
    platform: iOS
    sources: [SilentLink]
    settings:
      base:
        INFOPLIST_FILE: SilentLink/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: research.silentlink.recorder
schemes:
  SilentLink:
    build:
      targets:
        SilentLink: all
    run:
      config: Debug
